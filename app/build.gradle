plugins { id 'com.android.application' }

android {
    namespace 'ru.knigagolos.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'ru.knigagolos.app'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['onnx'] }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation files('libs/sherpa-onnx.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
}

tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/assets/piper/ru_RU-dmitri-medium.onnx').isFile() ||
            !file('libs/sherpa-onnx.aar').isFile()) {
            throw new GradleException('Run ./scripts/prepare-audio.sh from the repository root first.')
        }
    }
}
