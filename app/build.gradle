plugins { id 'com.android.application' }

def signingDir = new File(System.getenv('SLUKHOLIST_SIGNING_DIR') ?:
        new File(System.getProperty('user.home'), '.android/slukholist').path)
def releaseStore = new File(signingDir, 'release.p12')
def releasePassword = new File(signingDir, 'password.txt')

android {
    namespace 'ru.knigagolos.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'ru.slukholist.player'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.6.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseStore.isFile()) {
            release {
                storeFile releaseStore
                storeType 'PKCS12'
                storePassword releasePassword.getText('UTF-8').trim()
                keyAlias 'slukholist'
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            if (releaseStore.isFile()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['onnx'] }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation files('libs/sherpa-onnx.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
}

tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/assets/piper/ru_RU-dmitri-medium.onnx').isFile() ||
            !file('libs/sherpa-onnx.aar').isFile()) {
            throw new GradleException('Run ./scripts/prepare-audio.sh from the repository root first.')
        }
    }
}
